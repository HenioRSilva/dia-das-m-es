<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Construção</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      position: relative;
      overflow: hidden;
    }

    /* imagem de fundo com baixa opacidade */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('foto2.jpg') no-repeat center center/cover;
      opacity: 0.13; /* 10% visível */
      z-index: 0;
    }

    .text3d {
      position: relative;
      z-index: 1;
      font-size: 80px;
      font-weight: bold;
      text-transform: uppercase;
      color: #222;

      text-shadow:
        1px 1px 0 #999,
        2px 2px 0 #888,
        3px 3px 0 #777,
        4px 4px 0 #666,
        5px 5px 0 #555,
        6px 6px 10px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      .text3d {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="text3d">Página em Construção</div>
</body>
</html>
